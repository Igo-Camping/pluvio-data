name: BoM probe (throwaway)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe3:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "Characterise IDN60159 / IDN60167 / IDN60175 (Audley) from FTP and www"
        continue-on-error: true
        run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36"
          for f in IDN60159.html IDN60167.html IDN60175.html; do
            curl -sS -m 60 -o "ftp_$f" -w "$f FTP status=%{http_code} bytes=%{size_download}\n" "ftp://ftp.bom.gov.au/anon/gen/fwo/$f"
            curl -sS -m 60 -L -A "$UA" -o "www_$f" -w "$f WWW browser-UA status=%{http_code} bytes=%{size_download}\n" "http://www.bom.gov.au/fwo/$f"
            curl -sS -m 60 -L -o /dev/null -w "$f WWW default-UA status=%{http_code}\n" "http://www.bom.gov.au/fwo/$f"
            curl -sS -m 60 -L -A "$UA" -o /dev/null -w "$f WWW wrap_fwo.pl browser-UA status=%{http_code} bytes=%{size_download}\n" "http://www.bom.gov.au/cgi-bin/wrap_fwo.pl?$f"
          done
          python3 - <<'EOF'
          import re, html, os
          def cells(r): return [html.unescape(re.sub("<[^>]+>", "", c)).strip() for c in re.findall(r"<t[dh][^>]*>(.*?)</t[dh]>", r, re.S)]
          for f in ["IDN60159.html", "IDN60167.html", "IDN60175.html"]:
              for src in ["ftp_", "www_"]:
                  fn = src + f
                  if not os.path.exists(fn) or os.path.getsize(fn) == 0:
                      print("==", fn, "empty"); continue
                  t = open(fn, errors="ignore").read()
                  h1 = re.findall(r"<h1[^>]*>(.*?)</h1>|<h2[^>]*>(.*?)</h2>|<title>(.*?)</title>", t, re.S)
                  heads = [html.unescape(re.sub("<[^>]+>", "", "".join(x))).strip() for x in h1][:3]
                  issued = re.findall(r"[Ii]ssued at[^<\n]{0,60}", t)[:1]
                  print("==", fn, "| headings:", heads, "| issued:", issued)
                  for tb in re.findall(r"<table.*?</table>", t, re.S):
                      if not re.search(r"audley", tb, re.I): continue
                      rows = re.findall(r"<tr[^>]*>(.*?)</tr>", tb, re.S)
                      print("   rows:", len(rows))
                      for r in rows[:3]: print("   HDR:", cells(r)[:14])
                      for r in rows:
                          if re.search(r"audley", r, re.I): print("   AUDLEY:", cells(r)[:14]); break
                      break
                  if src == "www_": break   # only need one copy of the body detail
          EOF
